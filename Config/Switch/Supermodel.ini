; Up/down shifter manual transmission (all racers)
InputGearShiftUp = "JOY1_BUTTON6"
InputGearShiftDown = "JOY1_BUTTON5"

; 4-Speed manual transmission (Daytona 2, Sega Rally 2, Scud Race)
