; Supermodel.ini for the Nintendo Switch build.
; Copied to sdmc:/switch/supermodel/Config/ on first launch; edit that copy.
;
; Buttons use the Nintendo layout: BUTTON1 A, BUTTON2 B, BUTTON3 X, BUTTON4 Y,
;   BUTTON5 L, BUTTON6 R, BUTTON7 Minus, BUTTON8 Plus, BUTTON9/10 stick clicks,
;   ZAXIS_POS ZL, RZAXIS_POS ZR, POV1_* the D-pad, XAXIS/YAXIS the left stick.

;;
;; Supermodel Configuration File
;; Default settings for Version 0.3a.
;;
 

;
; Quick Overview
; --------------
;
; All settings are case sensitive.  Numbers must be integers.  Check your 
; spelling carefully because invalid settings are silently ignored.  To verify
; that your settings are being parsed correctly, check the contents of 
; error.log.
;
; Global options apply to all games.  To create configuration profiles for
; individual games, place settings under sections with the same name as the 
; corresponding MAME ROM set, like so:
;
;       ; Scud Race
;       [ scud ]
;
;       SoundVolume = 50
;       MusicVolume = 200
;       ; ... etc. ...
;
; Input mappings are an exceptional case: they are only allowed in the global
; section.  Per-game input mappings are not supported.
;
; For a list of all valid settings, please consult README.txt.  Only default
; inputs are assigned here.
;


[ Global ]  ; Input settings can only be read from the global section!

; Global Settings
GameXMLFile = Config/Games.xml
InitStateFile = 
PowerPCFrequency = 0
MultiThreaded = 1
PowerPCJit = 1    ; ARM64 recompiler. 0 = interpreter (slower; use it in Ryujinx)
JitNativeFP = 1   ; recompiler runs floating point natively (faster). 0 = interpreter for FP;
                  ; set it to 0 in a game's own section if that game misbehaves
GPUMultiThreaded = 1
MultiTexture = 0
VertexShader = 
FragmentShader = 
EmulateSound = 1
EmulateDSB = 1
SoundVolume = 100
MusicVolume = 100
SoundFreq = 57.5242
LegacySoundDSP = 0
Balance = 0
BalanceLeftRight = 0
BalanceFrontRear = 0
NbSoundChannels = 2

; Video/Display Settings
New3DEngine = 1
QuadRendering = 0
New3DBatchedDraws = 1   ; 1: per-mesh 3D state from one buffer instead of uniforms, method picked by a start-up self-test (see log)
                        ; 0: per-mesh uniforms, as upstream. 3: base instance. 4: generic attribute
                        ; 2: multi-draw indirect - hangs the GPU on the Switch, do not use there
XResolution = 1280
YResolution = 720
FullScreen = 1
BorderlessWindow = 0
Supersampling = 1
RenderScale = 100   ; % of the screen resolution the game renders at, then upscaled (25-100). 90 = 1152x648, 75 = 960x540: less GPU work
RenderScaleFilter = 1   ; upscale for RenderScale < 100: 1 Catmull-Rom (sharp), 0 bilinear (soft)
CRTcolors = 0
UpscaleMode = 2
WideScreen = 0
Stretch = 0
WideBackground = 0
VSync = 0    ; 0: no waiting for the screen refresh (smoother when a game runs below 60 FPS). 1: no tearing
Throttle = 1
RefreshRate = 60
ShowFrameRate = 1     ; writes the FPS and timings to Log/Supermodel.log every 5 s (nothing on screen)
ShowFPSOnScreen = 0   ; frame counter in the top-left corner
Crosshairs = 0
CrosshairStyle = vector
NoWhiteFlash = 0
FlipStereo = 0

; Input Settings
InputSystem = sdlgamepad

;
; Nintendo Switch: Minus + Plus exits, Minus + R saves a state, Minus + L loads it,
;   Minus + D-right changes slot, Minus + D-down pauses, Minus + R-stick resets.
;
InputUIExit = "JOY1_BUTTON7+JOY1_BUTTON8"
InputUISaveState = "JOY1_BUTTON7+JOY1_BUTTON6"
InputUILoadState = "JOY1_BUTTON7+JOY1_BUTTON5"
InputUIChangeSlot = "JOY1_BUTTON7+JOY1_POV1_RIGHT"
InputUIPause = "JOY1_BUTTON7+JOY1_POV1_DOWN"
InputUIReset = "JOY1_BUTTON7+JOY1_BUTTON10"
InputUIToggleFrameLimit = "JOY1_BUTTON7+JOY1_POV1_UP"
InputDigitalSensitivity = 25
InputDigitalDecaySpeed = 50
InputMouseXDeadZone = 0
InputMouseYDeadZone = 0
InputMouseZDeadZone = 0


; Common 
InputStart1 = "JOY1_BUTTON8"
InputStart2 = "JOY2_BUTTON8"
InputCoin1 = "JOY1_BUTTON7"
InputCoin2 = "JOY2_BUTTON7"
InputServiceA = "JOY1_BUTTON9"
InputServiceB = "NONE"
InputTestA = "JOY1_BUTTON10"
InputTestB = "NONE"

; 4-way digital joysticks
; We map D-Pad to BUTTON11-14 instead of POV UP/DOWN
InputJoyUp = "JOY1_POV1_UP,JOY1_UP"
InputJoyDown = "JOY1_POV1_DOWN,JOY1_DOWN"
InputJoyLeft = "JOY1_POV1_LEFT,JOY1_LEFT"
InputJoyRight = "JOY1_POV1_RIGHT,JOY1_RIGHT"

; Player 2 (if needed)
InputJoyUp2 = "JOY2_POV1_UP,JOY2_UP"
InputJoyDown2 = "JOY2_POV1_DOWN,JOY2_DOWN"
InputJoyLeft2 = "JOY2_POV1_LEFT,JOY2_LEFT"
InputJoyRight2 = "JOY2_POV1_RIGHT,JOY2_RIGHT"

; Fighting game buttons
InputPunch = "JOY1_BUTTON2"
InputKick = "JOY1_BUTTON1"
InputGuard = "JOY1_BUTTON4"
InputEscape = "JOY1_BUTTON3"
InputPunch2 = "JOY2_BUTTON2"
InputKick2 = "JOY2_BUTTON1"
InputGuard2 = "JOY2_BUTTON4"
InputEscape2 = "JOY2_BUTTON3"

; Spikeout buttons
InputShift = "JOY1_BUTTON4"
InputBeat = "JOY1_BUTTON2"
InputCharge = "JOY1_BUTTON1"
InputJump = "JOY1_BUTTON3"

; Virtua Striker buttons
InputShortPass = "JOY1_BUTTON2"
InputLongPass = "JOY1_BUTTON1"
InputShoot = "JOY1_BUTTON4"
InputShortPass2 = "JOY2_BUTTON2"
InputLongPass2 = "JOY2_BUTTON1"
InputShoot2 = "JOY2_BUTTON4"

; Steering wheel
InputSteeringLeft = "JOY1_POV1_LEFT"
InputSteeringRight = "JOY1_POV1_RIGHT"
InputSteering = "JOY1_XAXIS"

; Pedals
InputAccelerator = "JOY1_RZAXIS_POS,JOY1_BUTTON1"
